stages:
  - test
  - gitleaks
  - trivy-fs

test-vote:
  stage: test
  image: python:3.12
  tags:
    - test_runner
  script:
    - cd vote
    - pip install -r requirements.txt
    - python -m compileall .

test-result:
  stage: test
  image: node:20
  tags:
    - test_runner
  script:
    - cd result
    - npm ci
    - node --check server.js

test-worker:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:7.0
  tags:
    - test_runner
  script:
    - cd worker
#   - curl -I --connect-timeout 10 https://api.nuget.org/v3/index.json #we can remove this line if we are sure that nuget.org is reachable from the runner
    - dotnet build

gitleaks:
  stage: gitleaks
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint:
      - ""
  tags:
    - test_runner
  script:
    - gitleaks detect --source . --verbose --redact

trivy-fs:
  stage: trivy-fs
  image:
    name: aquasec/trivy:latest
    entrypoint:
      - ""
  tags:
    - test_runner
  script:
    - trivy fs --scanners vuln,secret,misconfig --exit-code 1 --severity HIGH,CRITICAL .