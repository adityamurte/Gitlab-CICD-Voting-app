update-gitops:
  stage: update-gitops
  image: alpine:latest
  tags:
    - test_runner
  before_script:
    - apk add --no-cache curl yq git
  script:

    - git clone https://${GITOPS_USERNAME}:${GITOPS_TOKEN}@${GITOPS_REPO_URL}
    - cd voting-app-gitops
    
    #set the git user name and email for the commit
    - git config --global user.name "test"
    - git config --global user.email "testmail"

  
    - git checkout -b ci/update-images-${CI_COMMIT_SHORT_SHA}

    #-i mean inplace edit, select the image by name and update the newTag to the current commit short SHA
    - yq -i '(.images[] | select(.name == "dockersamples/examplevotingapp_vote")).newTag = env(CI_COMMIT_SHORT_SHA)' k8s/overlays/dev/kustomization.yaml
    - yq -i '(.images[] | select(.name == "dockersamples/examplevotingapp_result")).newTag = env(CI_COMMIT_SHORT_SHA)' k8s/overlays/dev/kustomization.yaml
    - yq -i '(.images[] | select(.name == "dockersamples/examplevotingapp_worker")).newTag = env(CI_COMMIT_SHORT_SHA)' k8s/overlays/dev/kustomization.yaml  
    
    - yq '.images' k8s/overlays/dev/kustomization.yaml
    - git diff

    - git add k8s/overlays/dev/kustomization.yaml
    - git commit -m "Update images to ${CI_COMMIT_SHORT_SHA}"
    - git push origin HEAD  

    - |
      curl --fail --request POST \
        --header "PRIVATE-TOKEN: ${GITOPS_TOKEN}" \
        --data "source_branch=ci/update-images-${CI_COMMIT_SHORT_SHA}" \
        --data "target_branch=main" \
        --data-urlencode "title=Update images to ${CI_COMMIT_SHORT_SHA}" \
        "${CI_API_V4_URL}/projects/${GITOPS_PROJECT_ID}/merge_requests"

